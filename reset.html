<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Set a new password — SKLZ Labs</title>
<style>
  :root{--bg:#080A0F;--panel:#0F131C;--line:#1E2735;--ink:#EAEEF6;--muted:#8B94A8;
    --dim:#5B6377;--gold:#F5A623;--gold2:#FFC24B;--green:#34D399;--red:#F87171;
    --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    max-width:400px;width:100%;padding:30px}
  .logo{height:56px;display:block;margin:0 auto 20px}
  h1{font-size:21px;margin-bottom:8px;text-align:center}
  p.sub{color:var(--muted);font-size:13.5px;line-height:1.6;text-align:center;margin-bottom:20px}
  label{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;margin:14px 0 5px}
  input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
    padding:12px 13px;color:var(--ink);font-size:14px}
  input:focus{outline:none;border-color:var(--gold)}
  button{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#08101A;
    border:none;border-radius:10px;padding:13px;font-weight:700;font-size:14.5px;
    cursor:pointer;margin-top:18px}
  .msg{font-size:13px;margin-top:14px;text-align:center;line-height:1.6}
  .ok{color:var(--green)} .bad{color:var(--red)}
  a{color:var(--gold);text-decoration:none;font-size:13px}
  .foot{text-align:center;margin-top:18px}
</style></head>
<body>
<div class="box">
  <a href="/"><img src="/sklz-logo.png" class="logo" alt="SKLZ Labs"/></a>
  <h1>Set a new password</h1>
  <p class="sub">Choose something you have not used elsewhere.</p>
  <div id="form">
    <label>New password</label><input id="p1" type="password" autocomplete="new-password"/>
    <label>Confirm password</label><input id="p2" type="password" autocomplete="new-password"/>
    <button onclick="submit()">Save password</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="foot"><a href="/login.html">Back to login</a></div>
</div>
<script>
  const API="https://api.sklzlabs.com";
  // Supabase puts the token in the URL fragment
  function tokenFromUrl(){
    var h=location.hash.replace(/^#/,'');
    var p=new URLSearchParams(h);
    return p.get('access_token') || new URLSearchParams(location.search).get('access_token') || '';
  }
  var TOKEN = tokenFromUrl();
  if(!TOKEN){
    document.getElementById('form').style.display='none';
    document.getElementById('msg').innerHTML =
      '<span class="bad">This link is missing its reset token.</span><br>'+
      '<span style="color:#8B94A8">Request a new one from the login page.</span>';
  }
  async function submit(){
    var p1=document.getElementById('p1').value, p2=document.getElementById('p2').value;
    var msg=document.getElementById('msg');
    if(p1.length<8){msg.innerHTML='<span class="bad">Use at least 8 characters.</span>';return;}
    if(p1!==p2){msg.innerHTML='<span class="bad">The two passwords do not match.</span>';return;}
    msg.textContent='Saving\u2026';
    try{
      var r=await fetch(API+'/api/auth/set-password',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({access_token:TOKEN,password:p1})});
      var d=await r.json();
      if(r.ok&&d.ok){
        document.getElementById('form').style.display='none';
        msg.innerHTML='<span class="ok">\u2713 '+d.message+'</span>';
        setTimeout(function(){location.href='/login.html';},2000);
      } else {
        msg.innerHTML='<span class="bad">'+(d.detail||'Could not update the password.')+'</span>';
      }
    }catch(e){ msg.innerHTML='<span class="bad">Network error.</span>'; }
  }
</script>
</body></html>
