<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#080A0F"/>
<meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Login &amp; security — SKLZ Labs</title>
<style>
  :root{--bg:#080A0F;--panel:#0F131C;--panel2:#141A26;--line:#1E2735;--ink:#EAEEF6;
    --muted:#8B94A8;--dim:#5B6377;--gold:#F5A623;--gold2:#FFC24B;--green:#34D399;
    --red:#F87171;--blue:#1DA9E0;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
  a{color:inherit;text-decoration:none}
  nav{border-bottom:1px solid var(--line);background:var(--panel);padding:13px 20px;
    display:flex;align-items:center;gap:12px}
  nav img{height:46px}
  nav .sp{margin-left:auto;display:flex;gap:8px}
  .pill{border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12.5px;color:var(--muted)}
  .wrap{max-width:720px;margin:0 auto;padding:26px 20px 70px}
  h1{font-size:25px;letter-spacing:-.02em;margin-bottom:5px}
  .lead{color:var(--muted);font-size:13.5px;margin-bottom:22px;line-height:1.6}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:20px;margin-bottom:16px}
  .card h2{font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);margin-bottom:14px}
  .sub{color:var(--muted);font-size:13px;line-height:1.65;margin-bottom:14px}
  label{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;margin:13px 0 5px}
  input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;color:var(--ink);font-size:14px;font-family:var(--sans)}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .row{display:flex;gap:11px}
  .row>div{flex:1}
  @media(max-width:560px){.row{flex-direction:column;gap:0}}
  button{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#08101A;border:none;
    border-radius:10px;padding:12px 22px;font-weight:700;font-size:14px;cursor:pointer;margin-top:18px}
  button.ghost{background:transparent;border:1px solid rgba(248,113,113,.45);color:var(--red)}
  .email{font-family:var(--mono);font-size:13.5px;color:var(--ink);
    background:var(--panel2);border-radius:8px;padding:11px 13px}
  .msg{font-size:13px;margin-top:12px;line-height:1.6}
  .ok{color:var(--green)} .bad{color:var(--red)}
  .tfa-on{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3);
    border-radius:10px;padding:13px 15px;font-size:13.5px;line-height:1.6;color:var(--muted)}
  .tfa-on b{color:var(--green)}
  .qr{display:block;margin:14px auto;max-width:200px;background:#fff;padding:10px;border-radius:10px}
  .secret{font-size:12px;color:var(--muted);text-align:center;line-height:1.8;margin-bottom:8px}
  .secret code{font-family:var(--mono);color:var(--gold);font-size:12.5px;
    background:var(--panel2);padding:4px 8px;border-radius:5px;display:inline-block;margin-top:4px}
  .note{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.8;
    margin-top:20px;text-align:center}
</style><link rel="stylesheet" href="/sklz-mobile.css"/>
</head>
<body>
<nav><a href="/dashboard.html"><img src="/sklz-logo.png" alt="SKLZ"/></a><span style="font-weight:700">Login &amp; security</span><div class="sp"><a class="pill" href="/dashboard.html">← Dashboard</a><span class="pill" style="cursor:pointer" onclick="logout()">Log out</span></div></nav>
<div class="wrap">
  <h1>Login &amp; security</h1>
  <div class="lead">Your account details, password and sign-in protection.</div>
  <div class="card"><h2>Account</h2>
    <label>Email</label><div class="email" id="email">—</div>
    <label>Display name</label><input id="display_name" placeholder="How you want to be shown"/>
    <label>Phone</label><input id="phone" placeholder="+971 ..."/>
    <label>Address</label><input id="address_line1" placeholder="Street address"/>
    <input id="address_line2" placeholder="Apartment, suite (optional)" style="margin-top:8px"/>
    <div class="row">
      <div><label>City</label><input id="city"/></div>
      <div><label>Postcode</label><input id="postcode"/></div>
    </div>
    <div class="row">
      <div><label>Country</label><input id="country"/></div>
      <div><label>Preferred language</label><select id="language"><option value="en">English</option><option value="ar">العربية</option><option value="ru">Русский</option></select></div>
    </div>
    <button onclick="saveProfile()">Save changes</button>
    <div class="msg" id="p-msg"></div>
  </div>
  <div class="card"><h2>Password</h2>
    <label>Current password</label><input id="cur_pw" type="password" autocomplete="current-password"/>
    <label>New password</label><input id="new_pw" type="password" autocomplete="new-password"/>
    <label>Confirm new password</label><input id="new_pw2" type="password" autocomplete="new-password"/>
    <button onclick="changePassword()">Change password</button>
    <div class="msg" id="pw-msg"></div>
  </div>
  <div class="card"><h2>Two-factor authentication</h2>
    <div id="tfa"></div>
  </div>
  <div class="note">SKLZ never asks for your password by email or message.<br>If you receive such a request, it is not from us.</div>
</div>
<script>
  const API = "https://api.sklzlabs.com";
  function tok(){return localStorage.getItem('sklz_access')}
  if(!tok()) location.href='/login.html';
  function H(){return {'Authorization':'Bearer '+tok(),'Content-Type':'application/json'}}
  function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
  function gv(id){const e=document.getElementById(id);return e?e.value.trim():''}
  function say(id, html, cls){
    const e=document.getElementById(id);
    if(e) e.innerHTML='<span class="'+(cls||'')+'">'+html+'</span>';
  }

  let PROFILE={};

  async function loadProfile(){
    try{
      PROFILE = await (await fetch(API+'/api/profile',{headers:H()})).json();
    }catch(e){ PROFILE={}; }
    document.getElementById('email').textContent = PROFILE.email || '—';
    ['display_name','phone','address_line1','address_line2','city','country','postcode']
      .forEach(function(k){
        const el=document.getElementById(k);
        if(el) el.value = PROFILE[k] || '';
      });
    const lang=document.getElementById('language');
    if(lang) lang.value = PROFILE.language || 'en';
    renderTwoFactor();
  }

  async function saveProfile(){
    say('p-msg','Saving…');
    const body={
      display_name:gv('display_name'), phone:gv('phone'),
      address_line1:gv('address_line1'), address_line2:gv('address_line2'),
      city:gv('city'), country:gv('country'), postcode:gv('postcode'),
      language:(document.getElementById('language')||{}).value||'en'};
    try{
      const r=await fetch(API+'/api/profile',{method:'PUT',headers:H(),body:JSON.stringify(body)});
      const d=await r.json();
      if(r.ok&&d.ok){
        say('p-msg','✓ '+d.message,'ok');
        // keep the site language in step with the preference
        try{ localStorage.setItem('sklz_lang', body.language); }catch(e){}
      } else say('p-msg',esc(d.detail||'Could not save.'),'bad');
    }catch(e){ say('p-msg','Network error.','bad'); }
  }

  async function changePassword(){
    const cur=gv('cur_pw'), n1=gv('new_pw'), n2=gv('new_pw2');
    if(!cur){ say('pw-msg','Enter your current password.','bad'); return; }
    if(n1.length<8){ say('pw-msg','New password needs at least 8 characters.','bad'); return; }
    if(n1!==n2){ say('pw-msg','The two new passwords do not match.','bad'); return; }
    say('pw-msg','Updating…');
    try{
      const r=await fetch(API+'/api/auth/change-password',{method:'POST',headers:H(),
        body:JSON.stringify({current_password:cur,new_password:n1})});
      const d=await r.json();
      if(r.ok&&d.ok){
        say('pw-msg','✓ '+d.message,'ok');
        ['cur_pw','new_pw','new_pw2'].forEach(function(i){
          const e=document.getElementById(i); if(e) e.value='';});
      } else say('pw-msg',esc(d.detail||'Could not change password.'),'bad');
    }catch(e){ say('pw-msg','Network error.','bad'); }
  }

  function renderTwoFactor(){
    const box=document.getElementById('tfa');
    if(!box) return;
    if(PROFILE.two_factor_enabled){
      box.innerHTML=
        '<div class="tfa-on">🔒 Two-factor authentication is <b>on</b>. '+
        'You will be asked for a code from your authenticator app when signing in.</div>'+
        '<label>Password</label>'+
        '<input id="dis_pw" type="password" placeholder="Confirm with your password"/>'+
        '<button class="ghost" onclick="disable2fa()">Turn off two-factor</button>'+
        '<div class="msg" id="tfa-msg"></div>';
    } else {
      box.innerHTML=
        '<p class="sub">Add a second step at sign-in using an authenticator app '+
        '(Google Authenticator, Authy, 1Password). Recommended if you hold a '+
        'subscription or trade through the platform.</p>'+
        '<button onclick="enroll2fa()">Set up two-factor</button>'+
        '<div class="msg" id="tfa-msg"></div>';
    }
  }

  async function enroll2fa(){
    say('tfa-msg','Preparing…');
    try{
      const r=await fetch(API+'/api/profile/2fa/enroll',{method:'POST',headers:H()});
      const d=await r.json();
      if(!r.ok||!d.ok){ say('tfa-msg',esc(d.detail||'Could not start setup.'),'bad'); return; }
      const box=document.getElementById('tfa');
      box.innerHTML=
        '<p class="sub">Scan this with your authenticator app, then enter the '+
        '6-digit code it shows.</p>'+
        (d.qr_code?'<img class="qr" src="'+esc(d.qr_code)+'" alt="2FA QR code"/>':'')+
        (d.secret?'<div class="secret">Or enter this key manually:<br><code>'+
          esc(d.secret)+'</code></div>':'')+
        '<label>6-digit code</label>'+
        '<input id="tfa_code" inputmode="numeric" maxlength="8" placeholder="123456"/>'+
        '<button onclick="verify2fa(\'' + esc(d.factor_id) + '\')">Confirm and enable</button>'+
        '<div class="msg" id="tfa-msg"></div>';
    }catch(e){ say('tfa-msg','Network error.','bad'); }
  }

  async function verify2fa(factorId){
    const code=gv('tfa_code');
    if(!code){ say('tfa-msg','Enter the code from your app.','bad'); return; }
    say('tfa-msg','Checking…');
    try{
      const r=await fetch(API+'/api/profile/2fa/verify',{method:'POST',headers:H(),
        body:JSON.stringify({factor_id:factorId,code:code})});
      const d=await r.json();
      if(r.ok&&d.ok){
        say('tfa-msg','✓ '+d.message,'ok');
        PROFILE.two_factor_enabled=true;
        setTimeout(renderTwoFactor,1500);
      } else say('tfa-msg',esc(d.detail||'That code was not accepted.'),'bad');
    }catch(e){ say('tfa-msg','Network error.','bad'); }
  }

  async function disable2fa(){
    const pw=gv('dis_pw');
    if(!pw){ say('tfa-msg','Confirm with your password.','bad'); return; }
    if(!confirm('Turn off two-factor authentication?')) return;
    say('tfa-msg','Updating…');
    try{
      const r=await fetch(API+'/api/profile/2fa/disable',{method:'POST',headers:H(),
        body:JSON.stringify({password:pw})});
      const d=await r.json();
      if(r.ok&&d.ok){
        say('tfa-msg','✓ '+d.message,'ok');
        PROFILE.two_factor_enabled=false;
        setTimeout(renderTwoFactor,1200);
      } else say('tfa-msg',esc(d.detail||'Could not disable.'),'bad');
    }catch(e){ say('tfa-msg','Network error.','bad'); }
  }

  async function logout(){
    try{ await fetch(API+'/api/auth/logout',{method:'POST',headers:H()}); }catch(e){}
    localStorage.removeItem('sklz_access'); location.href='/';
  }

  loadProfile();

</script>
<script src="/sklz-mobile.js" defer></script>
</body></html>
