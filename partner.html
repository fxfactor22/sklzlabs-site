<!DOCTYPE html>
<html lang="en">
<head>
<script src="/sklz-auth.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Partner — SKLZ Labs</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/favicon.ico" sizes="32x32"/><link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="manifest" href="/manifest.json"/><meta name="theme-color" content="#070A10"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<script src="/sklz-pwa.js" defer></script>
<style>
  :root{--bg:#070A10;--panel:#0D1320;--panel2:#111827;--line:#1B2333;--ink:#E8EDF5;--muted:#9AA4B6;--dim:#6B7483;--gold:#FFB020;--blue:#22E0FF;--green:#34D399;--red:#FB7185;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;font-size:14px}
  a{color:inherit}
  .shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .side{position:sticky;top:0;height:100vh;overflow-y:auto}
  .main{padding:22px 26px 70px;min-width:0;max-width:1180px}
  .crumb{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .crumb h1{font-family:'Sora',var(--sans);font-size:24px;font-weight:800;letter-spacing:-.03em}
  .crumb .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .g12{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .c4{grid-column:span 4}.c8{grid-column:span 8}.c6{grid-column:span 6}.c12{grid-column:span 12}
  @media(max-width:1000px){.c4{grid-column:span 6}.c8{grid-column:span 12}}
  @media(max-width:820px){.main{padding:16px 14px 90px}.c4,.c6,.c8{grid-column:span 12}}
  .hero{position:relative;overflow:hidden;background:
    radial-gradient(70% 90% at 100% 0%,rgba(34,224,255,.14),transparent 60%),
    radial-gradient(60% 80% at 0% 100%,rgba(255,176,32,.18),transparent 60%),var(--panel)}
  .hero .lvl{font-family:'Sora',var(--sans);font-size:30px;font-weight:800;letter-spacing:-.04em}
  .hero .lvl small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;font-family:var(--sans);margin-left:8px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  @media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px}
  .linkrow{display:flex;gap:8px;margin-top:8px}
  .linkrow input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;color:#fff;font-family:var(--mono);font-size:12px;padding:11px 12px;min-width:0}
  select.sel{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;color:#fff;font:500 13px var(--sans);padding:10px 12px}
  .asset{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .asset:last-child{border-bottom:0}
  .asset .note{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .crow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .crow:last-child{border-bottom:0}.crow .mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .lrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .lrow:last-child{border-bottom:0}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#fff;color:#06090F;font-weight:600;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;transition:.2s;z-index:2000;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .disc{font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.7;margin-top:14px}
  .empty{color:var(--dim);font-size:13px;padding:10px 0}
  .script{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:8px}
  .script b{color:#fff}
</style>
<link rel="stylesheet" href="/sklz-shell.css"/>
</head>
<body>
<div class="shell">
  <aside class="side" data-nav></aside>
  <main class="main">
    <div class="crumb">
      <div><h1>Partner dashboard</h1><div class="sub">50% recurring on every membership you bring. No ranks to buy, no packages, no recruiting requirements.</div></div>
      <a class="sk-btn g" href="/affiliate.html">Program terms</a>
    </div>
    <div id="content"><div class="empty">Loading…</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="/sklz-shell.js" defer></script>
<script>
(function(){
  const API="https://api.sklzlabs.com";
  if(!SKLZAuth.hasSession()) SKLZAuth.toLogin();
  function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
  function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2600)}
  function money(n){return '$'+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
  const LEVELS=[['Partner',0],['Elite Partner',25],['Ambassador',100],['Legend',500]];
  const PLANS=[['', 'Home page'],['core','SKLZ Core · $119'],['plus','SKLZ Plus · $149'],['pro','SKLZ Pro · $179']];
  let D=null;

  async function load(){
    try{
      const r=await SKLZAuth.fetch(API+'/api/partner/me');
      if(r.status===401){SKLZAuth.clearSession();SKLZAuth.toLogin();return}
      const d=await r.json();
      if(d.detail){document.getElementById('content').innerHTML='<div class="empty">'+esc(d.detail)+'</div>';return;}
      D=d;render(d);
      if(location.hash){const el=document.querySelector(location.hash);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
    }catch(e){document.getElementById('content').innerHTML='<div class="empty">Could not load partner data.</div>';}
  }
  window.buildLink=function(){
    const plan=document.getElementById('plansel').value;
    const base=(D&&D.link)||'';
    const url=plan?base.replace(/\/\?ref=/,'/pricing.html?ref=')+'&plan='+plan:base;
    document.getElementById('afflink').value=url;
  }
  window.copyLink=function(){const i=document.getElementById('afflink');i.select();navigator.clipboard.writeText(i.value).then(()=>toast('Link copied')).catch(()=>toast('Copy failed'))}
  window.copyText=function(id){const t=document.getElementById(id).innerText;navigator.clipboard.writeText(t).then(()=>toast('Copied')).catch(()=>toast('Copy failed'))}
  window.requestPayout=async function(){
    try{const r=await SKLZAuth.fetch(API+'/api/partner/request-payout',{method:'POST'});const d=await r.json();
      toast(d.ok?('Payout requested: '+money(d.requested)):(d.note||'Nothing to withdraw'));if(d.ok)load();}
    catch(e){toast('Request failed')}
  }

  function render(d){
    const lvl=d.level||{name:'Partner'},act=(d.customers||{}).active||0;
    const idx=Math.max(0,LEVELS.findIndex(l=>l[0]===lvl.name));
    const prog=lvl.next_at?Math.min(100,Math.round(act/lvl.next_at*100)):100;
    const tl=LEVELS.map((l,i)=>'<div class="sk-tl '+(i<idx?'done':i===idx?'now':'')+'"><i></i>'+esc(l[0])+'<div style="font-family:var(--mono);font-size:10px;color:var(--dim)">'+l[1]+'+ active</div></div>').join('');
    const CL=(d.customer_list||[]).slice().sort((a,b)=>(b.active-a.active)||(b.commission-a.commission));
    window.__cl=CL;
    const custRow=c=>'<div class="crow"><span>'+esc(c.masked)+'</span><span class="sk-chip '+(c.active?'buy':'')+'">'+(c.active?'active':'inactive')+'</span><span class="mono">'+(c.months||0)+(c.source==='sklz'?' mo':' order'+((c.months||0)===1?'':'s'))+(c.since?' · since '+String(c.since).slice(0,10):'')+'</span><span class="mono" style="color:#fff">'+money(c.commission)+(c.source==='sklz'?'/mo':'')+'</span></div>';
    window.custFilter=function(){const q=(document.getElementById('cq')?.value||'').toLowerCase();const rows=window.__cl.filter(c=>!q||String(c.masked).toLowerCase().includes(q));
      document.getElementById('custlist').innerHTML=(rows.slice(0,window.__clAll?10000:40).map(custRow).join('')||'<div class="empty">No customers yet. Share your link — the first one is the hardest.</div>')+
      (rows.length>40&&!window.__clAll?'<div style="text-align:center;margin-top:10px"><button class="sk-btn g" onclick="window.__clAll=true;custFilter()">Show all '+rows.length+' customers</button></div>':'');};
    const custs='<div id="custlist"></div>';
    const ledger=(d.recent_commissions||[]).map(e=>'<div class="lrow"><span>'+(e.bonus>0?'Retention bonus + commission':'Commission')+(e.created_at?' <span class="mono">'+String(e.created_at).slice(0,10)+'</span>':'')+'</span><span class="sk-chip '+(e.status==='paid'?'buy':'')+'">'+esc(e.status)+'</span><span style="font-family:var(--mono);color:#fff">'+money(e.amount)+'</span></div>').join('')
      ||'<div class="empty">No commissions yet.</div>';
    const w=d.wallet||{};

    document.getElementById('content').innerHTML=
      '<div class="g12">'+
      '<section class="sk-card sk-art hero c12" style="background-image:url(/media/art-partner.jpg)">'+
        '<div class="eyebrow">Partner · your level</div><div class="lvl">'+esc(lvl.name)+'<small>'+(lvl.next?lvl.to_next+' more active customer'+(lvl.to_next===1?'':'s')+' → '+esc(lvl.next):'top level')+'</small></div>'+
        '<div class="sk-bar" style="margin-top:10px;max-width:420px"><i style="width:'+prog+'%"></i></div>'+
        '<div class="sk-timeline">'+tl+'</div>'+
        '<div class="kpis">'+
          '<div class="kpi"><div class="sk-k">Active customers</div><div class="sk-v sk-pos">'+act+'</div></div>'+
          '<div class="kpi"><div class="sk-k">Monthly commission</div><div class="sk-v" style="color:var(--gold)">'+money(d.mrr_commission)+'</div></div>'+
          '<div class="kpi"><div class="sk-k">Lifetime earned</div><div class="sk-v">'+money(w.earned)+'</div></div>'+
          '<div class="kpi"><div class="sk-k">Churned</div><div class="sk-v sk-neu">'+((d.customers||{}).churned||0)+'</div></div>'+
        '</div>'+
      '</section>'+

      '<section class="sk-card c6" id="links">'+
        '<div class="sk-h"><h3>Links &amp; assets</h3><span class="sk-chip">ref '+esc(d.code)+'</span></div>'+
        '<div class="sk-k">Build a link</div>'+
        '<div class="linkrow"><select class="sel" id="plansel" onchange="buildLink()">'+PLANS.map(p=>'<option value="'+p[0]+'">'+p[1]+'</option>').join('')+'</select></div>'+
        '<div class="linkrow"><input id="afflink" readonly value="'+esc(d.link)+'"/><button class="sk-btn p" onclick="copyLink()">Copy</button></div>'+
        '<div class="sk-k" style="margin-top:16px">What to send</div>'+
        '<div class="asset"><span>Track record (public, losses included)</span><a class="sk-chip" href="/perf.html?c=live" target="_blank" style="text-decoration:none">open</a></div>'+
        '<div class="asset"><span>Engine live monitor</span><a class="sk-chip" href="/bot.html" target="_blank" style="text-decoration:none">open</a></div>'+
        '<div class="asset"><span>Pricing — no initial fee, ~30% under the $170 memberships</span><a class="sk-chip" href="/pricing.html" target="_blank" style="text-decoration:none">open</a></div>'+
        '<div class="sk-k" style="margin-top:16px">Honest one-liner <a href="#" onclick="copyText(\'scr\');return false" style="color:var(--blue);font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px">copy</a></div>'+
        '<div class="script" id="scr">Trading software that runs on <b>your own account</b> — you keep the keys. The engine publishes its <b>full record, losses included</b>, and every decision is logged with its reason. <b>From $119/month, no initial fee.</b> Here is my link: '+esc(d.link)+'</div>'+
        '<div class="disc">Never promise returns, never say "guaranteed", never post a win without its losses. Partners who do are removed.</div>'+
      '</section>'+

      '<section class="sk-card c6" id="payouts">'+
        '<div class="sk-h"><h3>Payouts</h3><button class="sk-btn p" onclick="requestPayout()" '+((w.available||0)<=0?'disabled style="opacity:.5"':'')+'>Request payout · '+money(w.available)+'</button></div>'+
        '<div class="kpis" style="margin-top:0">'+
          '<div class="kpi"><div class="sk-k">Available</div><div class="sk-v sk-pos">'+money(w.available)+'</div></div>'+
          '<div class="kpi"><div class="sk-k">Pending</div><div class="sk-v">'+money(w.pending)+'</div></div>'+
          '<div class="kpi"><div class="sk-k">Paid out</div><div class="sk-v">'+money(w.paid_out)+'</div></div>'+
          '<div class="kpi"><div class="sk-k">Lifetime</div><div class="sk-v">'+money(w.earned)+'</div></div>'+
        '</div>'+
        '<div class="sk-k" style="margin:16px 0 4px">Recent commissions</div>'+ledger+
      '</section>'+

      '<section class="sk-card c12" id="customers">'+
        '<div class="sk-h"><h3>Customers</h3><span style="display:flex;gap:8px;align-items:center"><span class="sk-chip">'+((d.customers||{}).total||0)+' total · '+((d.customers||{}).active||0)+' active</span><input id="cq" placeholder="Search" oninput="custFilter()" style="background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:999px;color:#fff;padding:7px 12px;font:13px var(--sans);width:160px"/></span></div>'+custs+
        '<div class="disc">50% recurring commission on each active membership, for as long as it stays active. Payouts are processed manually by SKLZ Labs. You are responsible for any taxes on commissions earned.</div>'+
      '</section>'+
      '</div>';
    custFilter();
  }
  load();
})();
</script>
<script src="/sklz-i18n.js" defer></script>
</body>
</html>
